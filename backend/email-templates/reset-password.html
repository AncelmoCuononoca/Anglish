<!-- Supabase → Authentication → Email Templates → "Reset password".
     Uses Supabase's {{ .ConfirmationURL }} variable. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0D1B2A;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#112236;border-radius:20px;overflow:hidden;border:1px solid #1c3350;">
      <tr><td style="padding:28px 32px 8px;">
        <div style="font-size:22px;font-weight:800;color:#7F77DD;">Anglish AI</div>
      </td></tr>
      <tr><td style="padding:8px 32px 0;">
        <h1 style="margin:0 0 12px;color:#ffffff;font-size:24px;font-weight:800;">Reset your password</h1>
      </td></tr>
      <tr><td style="padding:0 32px;color:#aeb9c9;font-size:16px;line-height:1.6;">
        <p style="margin:0 0 20px;">We got a request to reset your Anglish AI password. Tap below to choose a new one. This link expires in 1 hour.</p>
      </td></tr>
      <tr><td style="padding:0 32px 28px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:linear-gradient(135deg,#7F77DD,#00D4FF);color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 32px;border-radius:12px;">Reset my password</a>
        <p style="margin:20px 0 0;color:#5f6e82;font-size:13px;line-height:1.5;">Didn't ask for this? Ignore this email and your password stays the same.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
